name: build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: restore
        run: dotnet restore

      - name: build
        run: dotnet build -c Release --no-restore

      - name: zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path bin/Release/net8.0/MoonlightSuite.dll -DestinationPath MoonlightSuite.zip

      - name: upload artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: MoonlightSuite
          path: bin/Release/net8.0/MoonlightSuite.dll

      - name: create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MoonlightSuite.zip
          generate_release_notes: true
